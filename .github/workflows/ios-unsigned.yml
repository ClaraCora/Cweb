name: Build unsigned iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "ProfileBrowser/**"
      - "ProfileBrowserTests/**"
      - "ProfileBrowserUITests/**"
      - "scripts/**"
      - "scripts/check-in.test.cjs"
      - "project.yml"
      - ".github/workflows/ios-unsigned.yml"

permissions:
  contents: write

concurrency:
  group: ios-unsigned-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26 # Retry after transient Actions startup outage
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          set -euo pipefail
          sw_vers
          xcodebuild -version
          swift --version

      - name: Verify check-in script behavior
        run: node --test scripts/check-in.test.cjs

      - name: Install XcodeGen
        run: |
          set -euo pipefail
          brew install xcodegen
          xcodegen --version

      - name: Generate Xcode project
        run: |
          set -euo pipefail
          xcodegen generate --spec project.yml
          test -d ProfileBrowser.xcodeproj

      - name: Run simulator tests
        run: |
          set -euo pipefail
          SIMULATOR_ID="$(xcrun simctl list devices available -j | jq -r '[.devices | to_entries[] | select(.key | contains("iOS-26"))] | sort_by(.key | split("iOS-")[1] | split("-") | map(tonumber)) | reverse | [.[].value[] | select(.name | startswith("iPhone"))][0].udid')"
          if [ -n "$SIMULATOR_ID" ] && [ "$SIMULATOR_ID" != "null" ]; then
            xcrun simctl bootstatus "$SIMULATOR_ID" -b
            xcodebuild test \
              -project ProfileBrowser.xcodeproj \
              -scheme ProfileBrowser \
              -configuration Debug \
              -parallel-testing-enabled NO \
              -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
              -derivedDataPath build/test \
              -resultBundlePath build/SimulatorTests.xcresult \
              CURRENT_PROJECT_VERSION="${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}" \
              CWEB_GIT_COMMIT="${GITHUB_SHA:0:7}"
          else
            echo "::error::No available iPhone Simulator. Native tests are required."
            exit 1
          fi
          xcrun simctl shutdown "$SIMULATOR_ID"

      - name: Run iPad UI tests
        run: |
          set -euo pipefail
          IPAD_ID="$(xcrun simctl list devices available -j | jq -r '[.devices | to_entries[] | select(.key | contains("iOS-26"))] | sort_by(.key | split("iOS-")[1] | split("-") | map(tonumber)) | reverse | [.[].value[] | select(.name | startswith("iPad"))][0].udid')"
          if [ -z "$IPAD_ID" ] || [ "$IPAD_ID" = "null" ]; then
            echo "::error::No available iOS 26 iPad Simulator. Native UI coverage is required."
            exit 1
          fi
          xcrun simctl bootstatus "$IPAD_ID" -b
          xcodebuild test \
            -project ProfileBrowser.xcodeproj \
            -scheme ProfileBrowser \
            -configuration Debug \
            -parallel-testing-enabled NO \
            -destination "platform=iOS Simulator,id=$IPAD_ID" \
            -only-testing:ProfileBrowserUITests \
            -derivedDataPath build/test \
            -resultBundlePath build/iPadUITests.xcresult \
            CURRENT_PROJECT_VERSION="${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}" \
            CWEB_GIT_COMMIT="${GITHUB_SHA:0:7}"
          xcrun simctl shutdown "$IPAD_ID"

      - name: Collect native failure diagnostics
        if: failure()
        run: |
          set -euo pipefail
          python3 scripts/summarize-native-crashes.py
          for RESULT in build/SimulatorTests.xcresult build/iPadUITests.xcresult; do
            if [ -d "$RESULT" ]; then
              xcrun xcresulttool export diagnostics --path "$RESULT" --output-path "build/native-failure/$(basename "$RESULT")" || true
              xcrun xcresulttool export attachments --path "$RESULT" --output-path "build/native-failure/attachments-$(basename "$RESULT")" || true
            fi
          done
          mkdir -p artifacts
          ditto -c -k --sequesterRsrc --keepParent build/native-failure artifacts/NativeFailureDiagnostics.zip

      - name: Save native failure diagnostics to Releases
        if: failure() && hashFiles('artifacts/NativeFailureDiagnostics.zip') != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ios-diagnostics-${{ github.run_number }}-${{ github.run_attempt }}
          target_commitish: ${{ github.sha }}
          name: Native test diagnostics ${{ github.run_number }}.${{ github.run_attempt }}
          prerelease: true
          make_latest: "false"
          fail_on_unmatched_files: true
          files: artifacts/NativeFailureDiagnostics.zip
          body: Native test failure evidence for https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Export native test evidence
        run: |
          set -euo pipefail
          mkdir -p artifacts
          xcrun xcresulttool export attachments --path build/SimulatorTests.xcresult --output-path artifacts/screenshots/iPhone
          xcrun xcresulttool export attachments --path build/iPadUITests.xcresult --output-path artifacts/screenshots/iPad
          mkdir -p build/native-test-results
          ditto build/SimulatorTests.xcresult build/native-test-results/SimulatorTests.xcresult
          ditto build/iPadUITests.xcresult build/native-test-results/iPadUITests.xcresult
          ditto -c -k --sequesterRsrc --keepParent build/native-test-results artifacts/SimulatorTests.xcresult.zip
          ditto -c -k --sequesterRsrc --keepParent artifacts/screenshots artifacts/NativeScreenshots.zip

      - name: Build device app without signing
        run: |
          set -euo pipefail
          xcodebuild build \
            -project ProfileBrowser.xcodeproj \
            -scheme ProfileBrowser \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/device \
            CURRENT_PROJECT_VERSION="${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}" \
            CWEB_GIT_COMMIT="${GITHUB_SHA:0:7}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM=""

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP_PATH="build/device/Build/Products/Release-iphoneos/ProfileBrowser.app"
          test -d "$APP_PATH"
          test -f "$APP_PATH/Info.plist"
          test -f "$APP_PATH/Assets.car"
          test -f "$APP_PATH/ProfileBrowser"
          test ! -e "$APP_PATH/embedded.mobileprovision"

          SHORT_SHA="${GITHUB_SHA:0:7}"
          CWEB_APP_BUILD="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP_PATH/Info.plist")"
          CWEB_APP_COMMIT="$(/usr/libexec/PlistBuddy -c 'Print :CwebGitCommit' "$APP_PATH/Info.plist")"
          echo "App identity: build=$CWEB_APP_BUILD commit=$CWEB_APP_COMMIT"
          if [ "$CWEB_APP_BUILD" != "${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}" ]; then
            echo "::error::App build number is $CWEB_APP_BUILD; expected ${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}."
            exit 1
          fi
          if [ "$CWEB_APP_COMMIT" != "$SHORT_SHA" ]; then
            echo "::error::App commit is $CWEB_APP_COMMIT; expected $SHORT_SHA."
            exit 1
          fi
          IPA_NAME="ProfileBrowser-unsigned-${SHORT_SHA}.ipa"
          mkdir -p artifacts/Payload
          ditto "$APP_PATH" artifacts/Payload/ProfileBrowser.app
          (
            cd artifacts
            /usr/bin/zip -qry "$IPA_NAME" Payload
            rm -rf Payload
            shasum -a 256 "$IPA_NAME" > SHA256SUMS.txt
            {
              echo "commit=$GITHUB_SHA"
              echo "runner=$RUNNER_OS $RUNNER_ARCH"
              xcodebuild -version | tr '\n' ' '
              echo
            } > BUILD-INFO.txt
          )

      - name: Publish unsigned IPA to GitHub Releases
        id: release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ios-unsigned-${{ github.run_number }}-${{ github.run_attempt }}
          target_commitish: ${{ github.sha }}
          name: Unsigned iOS build ${{ github.run_number }}.${{ github.run_attempt }}
          prerelease: true
          make_latest: "false"
          fail_on_unmatched_files: true
          files: |
            artifacts/*.ipa
            artifacts/SHA256SUMS.txt
            artifacts/BUILD-INFO.txt
            artifacts/SimulatorTests.xcresult.zip
            artifacts/NativeScreenshots.zip
          body: |
            自动构建的未签名 iOS IPA，安装前需自行签名。

            - Commit: `${{ github.sha }}`
            - 构建记录: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

            下载 IPA 和 `SHA256SUMS.txt` 后，在同一目录运行 `shasum -a 256 -c SHA256SUMS.txt` 校验文件。

      - name: Add release download link to summary
        env:
          RELEASE_URL: ${{ steps.release.outputs.url }}
        run: |
          printf '### Unsigned iOS IPA\n\n[Download release assets](%s)\n' "$RELEASE_URL" >> "$GITHUB_STEP_SUMMARY"
