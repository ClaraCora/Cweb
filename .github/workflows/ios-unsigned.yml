name: Build unsigned iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "ProfileBrowser/**"
      - "ProfileBrowserTests/**"
      - "scripts/check-in.test.cjs"
      - "project.yml"
      - ".github/workflows/ios-unsigned.yml"

permissions:
  contents: write

concurrency:
  group: ios-unsigned-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26 # Retry after transient Actions startup outage
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          set -euo pipefail
          sw_vers
          xcodebuild -version
          swift --version

      - name: Verify check-in script behavior
        run: node --test scripts/check-in.test.cjs

      - name: Install XcodeGen
        run: |
          set -euo pipefail
          brew install xcodegen
          xcodegen --version

      - name: Generate Xcode project
        run: |
          set -euo pipefail
          xcodegen generate --spec project.yml
          test -d ProfileBrowser.xcodeproj

      - name: Run simulator tests
        run: |
          set -euo pipefail
          SIMULATOR_ID="$(xcrun simctl list devices available -j | jq -r '[.devices[][] | select(.name | startswith("iPhone"))][0].udid')"
          if [ -n "$SIMULATOR_ID" ] && [ "$SIMULATOR_ID" != "null" ]; then
            xcodebuild test \
              -project ProfileBrowser.xcodeproj \
              -scheme ProfileBrowser \
              -configuration Debug \
              -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
              -derivedDataPath build/test
          else
            echo "No available iPhone Simulator found; continuing with device build."
          fi

      - name: Build device app without signing
        run: |
          set -euo pipefail
          xcodebuild build \
            -project ProfileBrowser.xcodeproj \
            -scheme ProfileBrowser \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/device \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM=""

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP_PATH="build/device/Build/Products/Release-iphoneos/ProfileBrowser.app"
          test -d "$APP_PATH"
          test -f "$APP_PATH/Info.plist"
          test -f "$APP_PATH/Assets.car"
          test -f "$APP_PATH/ProfileBrowser"
          test ! -e "$APP_PATH/embedded.mobileprovision"

          SHORT_SHA="${GITHUB_SHA:0:7}"
          IPA_NAME="ProfileBrowser-unsigned-${SHORT_SHA}.ipa"
          mkdir -p artifacts/Payload
          ditto "$APP_PATH" artifacts/Payload/ProfileBrowser.app
          (
            cd artifacts
            /usr/bin/zip -qry "$IPA_NAME" Payload
            rm -rf Payload
            shasum -a 256 "$IPA_NAME" > SHA256SUMS.txt
            {
              echo "commit=$GITHUB_SHA"
              echo "runner=$RUNNER_OS $RUNNER_ARCH"
              xcodebuild -version | tr '\n' ' '
              echo
            } > BUILD-INFO.txt
          )

      - name: Publish unsigned IPA to GitHub Releases
        id: release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ios-unsigned-${{ github.run_number }}-${{ github.run_attempt }}
          target_commitish: ${{ github.sha }}
          name: Unsigned iOS build ${{ github.run_number }}.${{ github.run_attempt }}
          prerelease: true
          make_latest: "false"
          fail_on_unmatched_files: true
          files: |
            artifacts/*.ipa
            artifacts/SHA256SUMS.txt
            artifacts/BUILD-INFO.txt
          body: |
            自动构建的未签名 iOS IPA，安装前需自行签名。

            - Commit: `${{ github.sha }}`
            - 构建记录: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

            下载 IPA 和 `SHA256SUMS.txt` 后，在同一目录运行 `shasum -a 256 -c SHA256SUMS.txt` 校验文件。

      - name: Add release download link to summary
        env:
          RELEASE_URL: ${{ steps.release.outputs.url }}
        run: |
          printf '### Unsigned iOS IPA\n\n[Download release assets](%s)\n' "$RELEASE_URL" >> "$GITHUB_STEP_SUMMARY"
